AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "Vouchmark: insurance claim rejection dispute assistant. Bedrock vision reads the letter, a rules engine scores each ground, and a counter letter is drafted. Stack: Lambda + API Gateway + DynamoDB + S3/CloudFront."

Parameters:
  BedrockModelId:
    Type: String
    Default: anthropic.claude-sonnet-4-20250514-v1:0
    Description: Bedrock model id (must be enabled for your account/region).
  DemoMode:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: true = serve canned analysis without calling Bedrock (offline demo).
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: CORS origin for the API. Set this to your CloudFront URL in prod.
  GuardrailId:
    Type: String
    Default: ""
    Description: Bedrock Guardrail id (create via scripts/create-guardrail.ps1).
  GuardrailVersion:
    Type: String
    Default: ""
    Description: Bedrock Guardrail version (e.g. 1).
  EnableTtl:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: true = expire case rows after CasesTtlDays.
  CasesTtlDays:
    Type: Number
    Default: 90
  UseCloudFront:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "true = serve the site via CloudFront (account CloudFront-verified). false = S3 static website endpoint for an immediate demo."

Conditions:
  EnableTtlCond: !Equals [!Ref EnableTtl, "true"]
  UseCloudFrontCond: !Equals [!Ref UseCloudFront, "true"]
  UseS3HostingCond: !Not [!Equals [!Ref UseCloudFront, "true"]]

Resources:
  CasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: caseId
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
        - AttributeName: caseId
          KeyType: RANGE
      TimeToLiveSpecification: !If
        - EnableTtlCond
        - AttributeName: expiresAt
          Enabled: true
        - !Ref "AWS::NoValue"

  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      OpenApiVersion: "3.0.1"
      DefinitionBody:
        openapi: "3.0.1"
        info:
          title: Vouchmark
          version: "1.0"
        paths:
          /health:
            get:
              responses:
                "200":
                  description: OK
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ClaimAnalyzerFunction.Arn}/invocations"
            options:
              responses:
                "200":
                  description: CORS
                  headers:
                    Access-Control-Allow-Origin:
                      schema:
                        type: string
                    Access-Control-Allow-Methods:
                      schema:
                        type: string
                    Access-Control-Allow-Headers:
                      schema:
                        type: string
              x-amazon-apigateway-integration:
                type: mock
                passthroughBehavior: WHEN_NO_TEMPLATES
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: "200"
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                      method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
                      method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Requested-With'"
                    responseTemplates:
                      application/json: "{}"
          /analyze:
            post:
              responses:
                "200":
                  description: Analysis
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ClaimAnalyzerFunction.Arn}/invocations"
            options:
              responses:
                "200":
                  description: CORS
                  headers:
                    Access-Control-Allow-Origin:
                      schema:
                        type: string
                    Access-Control-Allow-Methods:
                      schema:
                        type: string
                    Access-Control-Allow-Headers:
                      schema:
                        type: string
              x-amazon-apigateway-integration:
                type: mock
                passthroughBehavior: WHEN_NO_TEMPLATES
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: "200"
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                      method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
                      method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Requested-With'"
                    responseTemplates:
                      application/json: "{}"
          /cases:
            get:
              responses:
                "200":
                  description: Case list
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ClaimAnalyzerFunction.Arn}/invocations"
            options:
              responses:
                "200":
                  description: CORS
                  headers:
                    Access-Control-Allow-Origin:
                      schema:
                        type: string
                    Access-Control-Allow-Methods:
                      schema:
                        type: string
                    Access-Control-Allow-Headers:
                      schema:
                        type: string
              x-amazon-apigateway-integration:
                type: mock
                passthroughBehavior: WHEN_NO_TEMPLATES
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: "200"
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                      method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
                      method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Requested-With'"
                    responseTemplates:
                      application/json: "{}"
          /cases/{caseId}:
            get:
              parameters:
                - name: caseId
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                "200":
                  description: Case detail
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ClaimAnalyzerFunction.Arn}/invocations"
            options:
              responses:
                "200":
                  description: CORS
                  headers:
                    Access-Control-Allow-Origin:
                      schema:
                        type: string
                    Access-Control-Allow-Methods:
                      schema:
                        type: string
                    Access-Control-Allow-Headers:
                      schema:
                        type: string
              x-amazon-apigateway-integration:
                type: mock
                passthroughBehavior: WHEN_NO_TEMPLATES
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: "200"
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                      method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
                      method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Requested-With'"
                    responseTemplates:
                      application/json: "{}"

  AnalyzerApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ClaimAnalyzerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/*"

  ClaimAnalyzerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: analyze.lambda_handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          DEMO_MODE: !Ref DemoMode
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          GUARDRAIL_ID: !Ref GuardrailId
          GUARDRAIL_VERSION: !Ref GuardrailVersion
          CASES_TABLE: !Ref CasesTable
          CASES_TTL_DAYS: !Ref CasesTtlDays
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: InvokeBedrock
              Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
        - Statement:
            - Sid: CasesTableAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
              Resource: !GetAtt CasesTable.Arn

  # ---- Static frontend: S3 + CloudFront with Origin Access Control -----------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: UseCloudFrontCond
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: "OAC for the Vouchmark static site"
        SigningBehavior: always
        SigningProtocol: sigv4
        OriginAccessControlOriginType: s3

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCloudFrontCond
    DependsOn: FrontendBucket
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: s3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOAC
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: s3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: "658327ea-f89d-4fab-a63d-7e88639e58f6"
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: UseCloudFrontCond
    DependsOn: FrontendDistribution
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

  FrontendPublicPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: UseS3HostingCond
    DependsOn: FrontendBucket
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

Outputs:
  ApiUrl:
    Description: "API Gateway base URL"
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod/"
  CloudFrontUrl:
    Condition: UseCloudFrontCond
    Description: "Live frontend URL (CloudFront)"
    Value: !GetAtt FrontendDistribution.DomainName
  S3WebsiteUrl:
    Condition: UseS3HostingCond
    Description: "Live frontend URL (S3 static website, no CloudFront)"
    Value: !GetAtt FrontendBucket.WebsiteURL
  FrontendBucketName:
    Description: "S3 bucket holding the static site"
    Value: !Ref FrontendBucket
  FunctionArn:
    Description: "Analyzer Lambda ARN"
    Value: !GetAtt ClaimAnalyzerFunction.Arn